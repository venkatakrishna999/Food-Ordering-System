<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Delight - Order App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
    }
    
    /* Sidebar Styling */
    .sidebar {
      width: 220px;
      background: linear-gradient(to bottom, #ff6d00, #ff9800);
      padding-top: 20px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 2px 0 15px rgba(0,0,0,0.1);
      z-index: 100;
      overflow-y: auto;
    }
    
    .logo-container {
      margin-bottom: 25px;
      text-align: center;
      padding: 0 15px;
    }
    
    .logo-container img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .logo-container h1 {
      margin: 12px 0 0;
      color: white;
      font-size: 1.4rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }
    
    .menu-header {
      width: 100%;
      padding: 12px 0;
      text-align: center;
      background-color: rgba(255,255,255,0.15);
      margin-bottom: 15px;
      border-top: 1px solid rgba(255,255,255,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    
    .menu-header h2 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    
    .sidebar-buttons {
      width: 100%;
      padding: 0 10px;
    }
    
    .sidebar button {
      background-color: rgba(255,255,255,0.9);
      color: #333;
      border: none;
      margin: 8px 0;
      font-size: 15px;
      cursor: pointer;
      padding: 12px 20px;
      width: 100%;
      border-radius: 30px;
      text-align: left;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
    }
    
    .sidebar button i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }
    
    .sidebar button:hover {
      background-color: #ffd54f;
      transform: translateX(5px);
    }
    
    .sidebar button.active {
      background-color: #ffd54f;
      box-shadow: 0 0 15px rgba(255, 213, 79, 0.6);
    }
    
    /* Main Content Area */
    .main {
      margin-left: 220px;
      padding: 20px;
      flex-grow: 1;
      background-color: #f8f9fa;
    }
    
    /* Top Bar Styling */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to right, #ff6d00, #ff9800);
      padding: 15px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      color: white;
    }
    
    .topbar .center {
      font-weight: bold;
      font-size: 1.3rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    
    .topbar .right {
      display: flex;
      gap: 15px;
    }
    
    .topbar .right button {
      background-color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      color: #ff6d00;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .topbar .right button:hover {
      background-color: #ffd54f;
      transform: translateY(-2px);
    }
    
    /* Food Items Grid */
    .food-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.8rem;
      margin-top: 25px;
    }
    
    .food-item {
      border-radius: 12px;
      overflow: hidden;
      background: white;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      position: relative;
    }
    
    .food-item:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }
    
    .food-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .food-info {
      padding: 15px;
    }
    
    .food-info h4 {
      margin: 5px 0;
      font-size: 1.1rem;
      color: #333;
      line-height: 1.3;
    }
    
    .food-category {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 109, 0, 0.9);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .food-price {
      margin: 8px 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff6d00;
    }
    
    .add-btn {
      width: 100%;
      background: linear-gradient(to right, #4CAF50, #2E7D32);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    
    .add-btn:hover {
      background: linear-gradient(to right, #43A047, #1B5E20);
      transform: translateY(-3px);
      box-shadow: 0 4px 8px rgba(46, 125, 50, 0.4);
    }
    
    /* Cart Styling */
    .cart {
      position: fixed;
      right: 0;
      top: 0;
      height: 100%;
      width: 350px;
      background: white;
      box-shadow: -3px 0 20px rgba(0, 0, 0, 0.2);
      transform: translateX(100%);
      transition: transform 0.4s ease;
      z-index: 1000;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    
    .cart.active {
      transform: translateX(0);
    }
    
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #eee;
    }
    
    .cart-header h2 {
      color: #ff6d00;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .close-cart {
      background: #f0f0f0;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .close-cart:hover {
      background: #ff6d00;
      color: white;
    }
    
    .cart-content {
      flex-grow: 1;
      padding: 10px 0;
    }
    
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }
    
    .cart-item-info {
      flex-grow: 1;
    }
    
    .cart-item-name {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    
    .cart-item-price {
      color: #ff6d00;
      font-weight: 600;
    }
    
    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .cart-item-quantity button {
      background: #ffd54f;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    
    .cart-total {
      padding: 20px 0;
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      text-align: right;
      border-top: 2px solid #eee;
      margin-top: 10px;
    }
    
    .cart-total span {
      color: #ff6d00;
    }
    
    .place-order-btn {
      background: linear-gradient(to right, #ff6d00, #ff9800);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 109, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    
    .place-order-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 109, 0, 0.4);
      background: linear-gradient(to right, #ff5e00, #ff8a00);
    }
    
    .empty-cart {
      text-align: center;
      color: #777;
      padding: 40px 20px;
      font-style: italic;
    }
    
    .empty-cart i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #e0e0e0;
    }
    
    /* Overlay and Modal */
    .cart-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
    
    .cart-overlay.active {
      display: block;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1001;
      justify-content: center;
      align-items: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 380px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      animation: pop 0.4s ease;
    }
    
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .modal-content i {
      font-size: 3.5rem;
      color: #4CAF50;
      margin-bottom: 20px;
    }
    
    .modal-content h3 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #333;
    }
    
    .modal-content p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #555;
      line-height: 1.5;
    }
    
    .close-modal {
      background: linear-gradient(to right, #ff6d00, #ff9800);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .close-modal:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 109, 0, 0.3);
    }
    
    .cart-badge {
      background-color: #ff6d00;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      margin-left: 5px;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        width: 180px;
      }
      
      .main {
        margin-left: 180px;
      }
      
      .food-list {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
      
      .cart {
        width: 300px;
      }
    }
    
    @media (max-width: 576px) {
      .sidebar {
        width: 160px;
      }
      
      .main {
        margin-left: 160px;
      }
      
      .food-list {
        grid-template-columns: 1fr;
      }
      
      .topbar .center {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar with menu categories -->
  <div class="sidebar">
    <div class="logo-container">
      <img src="images/image-logo.jpeg.jpg" alt="Logo">
      <h1>Food Delight</h1>
    </div>
    
    <div class="menu-header">
      <h2>MENU CATEGORIES</h2>
    </div>
    
    <div class="sidebar-buttons">
      <button class="active" data-category="all">
        <i class="fas fa-utensils"></i> All Items
      </button>
      <button data-category="chicken">
        <i class="fas fa-drumstick-bite"></i> Chicken
      </button>
      <button data-category="biryani">
        <i class="fas fa-utensil-spoon"></i> Biryani
      </button>
      <button data-category="paneer">
        <i class="fas fa-cheese"></i> Paneer
      </button>
      <button data-category="vegetables">
        <i class="fas fa-carrot"></i> Vegetables
      </button>
      <button data-category="chinese">
        <i class="fas fa-flag"></i> Chinese
      </button>
      <button data-category="south-indian">
        <i class="fas fa-mortar-pestle"></i> South Indian
      </button>
    </div>
  </div>

  <!-- Main content area -->
  <div class="main">
    <div class="topbar">
      <div class="center">Welcome to Food Delight - Enjoy Delicious Food Anytime!</div>
      <div class="right">
        <button onclick="showOffers()">
          <i class="fas fa-tag"></i> Offers
        </button>
        <button onclick="showAccount()">
          <i class="fas fa-user"></i> Account
        </button>
        <button onclick="toggleCart()">
          <i class="fas fa-shopping-cart"></i> Cart <span id="cart-count" class="cart-badge">0</span>
        </button>
      </div>
    </div>
    
    <div class="food-list" id="food-list"></div>
  </div>

  <!-- Shopping Cart -->
  <div id="cart" class="cart">
    <div class="cart-header">
      <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2>
      <button class="close-cart" onclick="toggleCart()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div id="cart-content" class="cart-content"></div>
    
    <div class="cart-total">
      Total: ₹<span id="cart-total">0</span>
    </div>
    
    <button class="place-order-btn" onclick="placeOrder()">
      <i class="fas fa-check-circle"></i> Place Order
    </button>
  </div>
  
  <!-- Cart overlay -->
  <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>
  
  <!-- Order confirmation modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <i class="fas fa-check-circle"></i>
      <h3>Order Confirmed!</h3>
      <p>Your order has been placed successfully and will be delivered in 30-45 minutes.</p>
      <p>Thank you for choosing Food Delight!</p>
      <button class="close-modal" onclick="document.getElementById('orderModal').classList.remove('active')">
        Continue Shopping
      </button>
    </div>
  </div>

  <script>
    // Food items data
    const foodItems = [
      { id: 1, name: "Ambur Chicken Biryani", category: "biryani", price: 180, img: "images/biryani/Ambur-Chicken-Biryani.jpg" },
      { id: 2, name: "Paneer Butter Masala", category: "paneer", price: 160, img: "images/chicken/Chicken_roast.jpg" },
      { id: 3, name: "Chicken Tikka", category: "chicken", price: 200, img: "images/chinese/Chili-Chicken.jpg" },
      { id: 4, name: "Veg Pulao", category: "vegetables", price: 120, img: "images/paneer/Matar-Paneer.jpg" },
      { id: 5, name: "Chicken Manchurian", category: "chinese", price: 140, img: "images/chinese/ChickenManchurian.jpg" },
      { id: 6, name: "Masala Dosa", category: "south-indian", price: 100, img: "images/south_indian/masala-dosa.jpg" },
      { id: 7, name: "Idly with Rice Flour", category: "south-indian", price: 100, img: "images/south_indian/idli-with-rice-flour.jpg" },
      { id: 8, name: "Chicken Biryani", category: "biryani", price: 180, img: "images/biryani/Chicken-Biryani-hyd.jpg" },
      { id: 9, name: "Goan Fish Biryani", category: "biryani", price: 180, img: "images/biryani/goan-fish-biryani.jpg" },
      { id: 10, name: "Mutton Biryani", category: "biryani", price: 180, img: "images/biryani/hyd-Mutton-Biryani.jpg" },
      { id: 11, name: "Kamrupi Biryani", category: "biryani", price: 180, img: "images/biryani/kamrupi-biryani.jpg" },
      { id: 12, name: "Momos", category: "chinese", price: 180, img: "images/chinese/mmos.jpg" },
      { id: 13, name: "Chicken Manchurian", category: "chinese", price: 180, img: "images/chinese/ChickenManchurian.jpg" },
      { id: 14, name: "Chilli Chicken", category: "chinese", price: 180, img: "images/chinese/Chili-Chicken.jpg" },
      { id: 15, name: "Chow Mein", category: "chinese", price: 180, img: "images/chinese/chowmin.jpg" },
      { id: 16, name: "Spring Rolls", category: "chinese", price: 180, img: "images/chinese/spring-rolls.jpg" },
      { id: 17, name: "Handi Chicken", category: "chicken", price: 180, img: "images/chicken/Handi-chicken.jpg" },
      { id: 18, name: "Chicken Roast", category: "chicken", price: 180, img: "images/chicken/Chicken_roast.jpg" },
      { id: 19, name: "Chicken Do Pyaza", category: "chicken", price: 180, img: "images/chicken/Chicken-do-Pyaza.jpg" },
      { id: 20, name: "Matar Paneer", category: "paneer", price: 180, img: "images/paneer/Matar-Paneer.jpg" },
      { id: 21, name: "Palak Paneer", category: "paneer", price: 180, img: "images/paneer/palak-paneer.jpg" },
      { id: 22, name: "Shahi Paneer", category: "paneer", price: 180, img: "images/paneer/shahi-paneer.jpg" },
      { id: 23, name: "Vegetable Pakora", category: "vegetables", price: 180, img: "images/vegetables/vegetable-pakora.jpg" },
      { id: 24, name: "Vegetable Kolhapuri", category: "vegetables", price: 180, img: "images/vegetables/vegetable-kolhapuri.jpg" },
      { id: 25, name: "Mysore Bonda", category: "south-indian", price: 180, img: "images/south_indian/mysore-bonda.jpg" },
      { id: 26, name: "Sambar Vada", category: "south-indian", price: 180, img: "images/south_indian/sambhar-vada.jpg" },
      { id: 27, name: "Veg Jalfrezi", category: "vegetables", price: 180, img: "images/vegetables/VEG-JALFREZI.jpg" },
    ];

    let cartItems = [];

    // Initialize the app
    document.addEventListener('DOMContentLoaded', function() {
      renderFoodItems('all');
      
      // Add event listeners to category buttons
      const categoryButtons = document.querySelectorAll('.sidebar-buttons button');
      categoryButtons.forEach(button => {
        button.addEventListener('click', function() {
          // Remove active class from all buttons
          categoryButtons.forEach(btn => btn.classList.remove('active'));
          
          // Add active class to clicked button
          this.classList.add('active');
          
          // Get category from data attribute
          const category = this.getAttribute('data-category');
          
          // Render items for selected category
          renderFoodItems(category);
        });
      });
    });

    // Render food items based on category
    function renderFoodItems(category = 'all') {
      const list = document.getElementById('food-list');
      list.innerHTML = '';
      
      // Filter items
      const filtered = category === 'all' ? foodItems : foodItems.filter(item => item.category === category);
      
      // Display items
      if (filtered.length === 0) {
        list.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; padding: 40px; font-style: italic; color: #666;">No items found in this category.</p>';
        return;
      }
      
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.classList.add('food-item');
        div.innerHTML = `
          <div class="food-category">${item.category}</div>
          <img src="${item.img}" alt="${item.name}" class="food-img">
          <div class="food-info">
            <h4>${item.name}</h4>
            <div class="food-price">₹${item.price}</div>
            <button class="add-btn" onclick="addToCart(${item.id})">
              <i class="fas fa-plus"></i> Add to Cart
            </button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    // Add item to cart
    function addToCart(id) {
      const item = foodItems.find(f => f.id === id);
      const existing = cartItems.find(c => c.id === id);
      
      if (existing) {
        existing.quantity += 1;
      } else {
        cartItems.push({ ...item, quantity: 1 });
      }
      
      updateCartUI();
      
      // Show added animation
      const button = event.target.closest('.add-btn');
      button.innerHTML = '<i class="fas fa-check"></i> Added';
      button.style.background = '#4CAF50';
      setTimeout(() => {
        button.innerHTML = '<i class="fas fa-plus"></i> Add to Cart';
        button.style.background = 'linear-gradient(to right, #4CAF50, #2E7D32)';
      }, 1000);
    }

    // Toggle cart visibility
    function toggleCart() {
      const cart = document.getElementById('cart');
      const overlay = document.getElementById('cart-overlay');
      cart.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    // Update cart UI
    function updateCartUI() {
      const cartContent = document.getElementById('cart-content');
      const cartTotal = document.getElementById('cart-total');
      const cartCount = document.getElementById('cart-count');
      
      // Update cart count
      const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
      cartCount.textContent = totalItems;
      
      cartContent.innerHTML = '';
      
      if (cartItems.length === 0) {
        cartContent.innerHTML = `
          <div class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <p>Your cart is empty</p>
            <p>Add some delicious items!</p>
          </div>
        `;
        cartTotal.textContent = '0';
        return;
      }
      
      let total = 0;
      cartItems.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        
        const div = document.createElement('div');
        div.classList.add('cart-item');
        div.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">₹${item.price} × ${item.quantity} = ₹${itemTotal}</div>
          </div>
          <div class="cart-item-quantity">
            <button onclick="changeQuantity(${item.id}, -1)">-</button>
            <span>${item.quantity}</span>
            <button onclick="changeQuantity(${item.id}, 1)">+</button>
          </div>
        `;
        cartContent.appendChild(div);
      });
      
      cartTotal.textContent = total;
    }
    
    // Change item quantity in cart
    function changeQuantity(id, change) {
      const item = cartItems.find(c => c.id === id);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          cartItems = cartItems.filter(c => c.id !== id);
        }
        updateCartUI();
      }
    }

    // Place order
    function placeOrder() {
      if (cartItems.length === 0) {
        alert("Your cart is empty. Add some items before placing an order!");
        return;
      }
      
      document.getElementById('orderModal').classList.add('active');
      cartItems = [];
      updateCartUI();
      toggleCart();
    }

    // Show offers
    function showOffers() {
      const offers = [
        "🔥 TODAY'S SPECIAL OFFERS 🔥",
        "1. Get 20% off on all Biryani orders!",
        "2. Buy 1 Get 1 Free on Appetizers every Thursday",
        "3. Free dessert on orders above ₹500",
        "4. Family Combo (4 items) for just ₹799",
        "5. Weekend Special: 15% off on all South Indian dishes"
      ].join("\n\n");
      
      alert(offers);
    }

    // Show account details
    function showAccount() {
      alert("👤 ACCOUNT DETAILS\n\nName: Anil Reddy\nPhone: 6301036615\nEmail: anilreddy1234@example.com\n\nLoyalty Points: 450\n\nMember since: Jan 2023");
    }
  </script>
